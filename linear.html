<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Solver Pro</title>
    <style>
        /* CSS: Makes it look clean and professional */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f6f8fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        h1 { color: #1f2328; margin-bottom: 0.5rem; }
        p { color: #636c76; margin-bottom: 1.5rem; }

        .input-group {
            margin: 25px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        input {
            width: 70px;
            padding: 12px;
            border: 2px solid #d0d7de;
            border-radius: 8px;
            text-align: center;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #0969da;
        }

        button {
            background-color: #2da44e;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
        }

        button:hover { background-color: #2c974b; }

        #result-area {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #d0d7de;
            text-align: left;
            animation: fadeIn 0.4s ease-out;
        }

        .step {
            background: #f3f4f6;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-family: monospace;
        }

        #final-answer {
            font-size: 1.8rem;
            font-weight: bold;
            color: #0969da;
            text-align: center;
            margin-top: 15px;
        }

        .hidden { display: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Linear Solver</h1>
        <p>Enter values for <strong>ax + b = c</strong></p>
        
        <div class="input-group">
            <input type="number" id="valA" placeholder="a">
            <span>x +</span>
            <input type="number" id="valB" placeholder="b">
            <span>=</span>
            <input type="number" id="valC" placeholder="c">
        </div>

        <button onclick="solveEquation()">Solve Equation</button>

        <div id="result-area" class="hidden">
            <div id="step1" class="step"></div>
            <div id="step2" class="step"></div>
            <div id="final-answer"></div>
        </div>
    </div>

    <script>
        // JavaScript: The logic engine
        function solveEquation() {
            const a = parseFloat(document.getElementById('valA').value);
            const b = parseFloat(document.getElementById('valB').value);
            const c = parseFloat(document.getElementById('valC').value);
            const resultArea = document.getElementById('result-area');

            // Validation
            if (isNaN(a) || isNaN(b) || isNaN(c)) {
                alert("Please fill in all three fields.");
                return;
            }

            if (a === 0) {
                alert("The value of 'a' cannot be zero.");
                return;
            }

            // Show UI
            resultArea.classList.remove('hidden');

            // Step 1: Subtraction logic
            const cMinusB = c - b;
            document.getElementById('step1').innerHTML = `<strong>Step 1:</strong> Subtract ${b} from both sides<br>
                ${a}x = ${c} - (${b}) <br>
                ${a}x = ${cMinusB}`;
            
            // Step 2: Division logic
            const solution = cMinusB / a;
            // Round to 4 decimal places if it's a long decimal
            const cleanSolution = Number.isInteger(solution) ? solution : solution.toFixed(4);

            document.getElementById('step2').innerHTML = `<strong>Step 2:</strong> Divide by ${a}<br>
                x = ${cMinusB} / ${a}`;

            // Final Result
            document.getElementById('final-answer').innerText = `x = ${cleanSolution}`;
        }
    </script>
</body>
</html>
