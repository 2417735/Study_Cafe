<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Optimizer | Mobile-Ready</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Fira+Code&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #020617; color: #e2e8f0; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(59, 130, 246, 0.2); }
        .hidden { display: none; }
        input { 
            background: #0f172a !important; 
            border: 1px solid #1e293b !important; 
            text-align: center; 
            font-weight: bold;
            min-width: 0; /* Prevents inputs from pushing past screen width */
        }
        .equation-font { font-family: 'Fira Code', monospace; }
        
        /* Mobile Specific Tweaks */
        @media (max-width: 640px) {
            .equation-text { font-size: 1.5rem !important; }
            input { width: 70px !important; padding: 0.75rem !important; }
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-10 flex flex-col items-center justify-center">

    <a href="index.html" class="fixed top-4 left-4 md:top-8 md:left-8 text-[10px] md:text-xs font-bold uppercase tracking-widest text-slate-500 hover:text-blue-400 transition-all z-50">
        &larr; Exit
    </a>

    <div id="mode-selector" class="max-w-4xl w-full text-center py-10">
        <h1 class="text-3xl md:text-4xl font-black mb-10 italic tracking-tighter uppercase">Select Math Power</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div onclick="showMode('basic')" class="glass p-8 rounded-[2.5rem] cursor-pointer hover:border-blue-500 hover:scale-105 transition-all group">
                <div class="text-4xl mb-4">🌱</div>
                <h3 class="text-xl font-bold mb-2">Basic Solver</h3>
                <p class="text-xs opacity-50">Simple Ax + B = C</p>
            </div>
            <div onclick="showMode('pro')" class="glass p-8 rounded-[2.5rem] cursor-pointer hover:border-purple-500 hover:scale-105 transition-all group">
                <div class="text-4xl mb-4">⚡</div>
                <h3 class="text-xl font-bold mb-2">Pro Optimizer</h3>
                <p class="text-xs opacity-50">Advanced Ax + By = C</p>
            </div>
        </div>
    </div>

    <div id="app-container" class="hidden max-w-6xl w-full grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <div class="lg:col-span-8 glass rounded-[2.5rem] p-6 md:p-12">
            <button onclick="resetApp()" class="text-[10px] font-bold opacity-30 uppercase hover:opacity-100 mb-6 flex items-center gap-1">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
                Change Mode
            </button>
            
            <div id="basic-form" class="hidden">
                <h2 class="text-xl font-black mb-6 opacity-40 uppercase tracking-widest">Basic Solver</h2>
                <div class="flex flex-wrap items-center justify-center gap-3 md:gap-4 text-2xl md:text-4xl font-bold equation-font equation-text">
                    <input type="number" id="basic-a" placeholder="A" class="w-20 md:w-28 p-3 md:p-4 rounded-2xl">
                    <span>x</span>
                    <span>+</span>
                    <input type="number" id="basic-b" placeholder="B" class="w-20 md:w-28 p-3 md:p-4 rounded-2xl">
                    <span>=</span>
                    <input type="number" id="basic-c" placeholder="C" class="w-20 md:w-28 p-3 md:p-4 rounded-2xl border-blue-500/50">
                </div>
            </div>

            <div id="pro-form" class="hidden text-center md:text-left">
                <h2 class="text-xl font-black mb-6 opacity-40 uppercase tracking-widest">Pro Optimizer</h2>
                <div class="flex flex-wrap items-center justify-center md:justify-start gap-3 md:gap-4 text-xl md:text-3xl font-bold equation-font equation-text">
                    <input type="number" id="pro-a" placeholder="A" class="w-16 md:w-24 p-3 md:p-4 rounded-2xl">
                    <span>x</span>
                    <span>+</span>
                    <input type="number" id="pro-b" placeholder="B" class="w-16 md:w-24 p-3 md:p-4 rounded-2xl">
                    <span>y</span>
                    <span>=</span>
                    <input type="number" id="pro-c" placeholder="C" class="w-16 md:w-24 p-3 md:p-4 rounded-2xl">
                </div>
                <div class="mt-6 p-4 bg-white/5 rounded-2xl inline-block">
                    <span class="text-xs font-bold opacity-40 uppercase mr-2">Given Y =</span>
                    <input type="number" id="pro-y" value="0" class="w-16 md:w-20 p-2 rounded-lg">
                </div>
            </div>

            <button onclick="processMath()" class="w-full mt-10 bg-blue-600 hover:bg-blue-500 text-white font-black py-5 rounded-[1.5rem] md:rounded-[2rem] transition-all shadow-xl shadow-blue-900/20 uppercase tracking-widest text-xs md:text-sm">
                Compute Result
            </button>

            <div class="mt-8 flex justify-between items-center bg-white/5 p-6 rounded-[1.5rem] md:rounded-[2rem] border border-white/5">
                <span class="text-[10px] md:text-xs font-bold opacity-40 uppercase tracking-widest">Result X</span>
                <div id="final-x" class="text-4xl md:text-6xl font-black text-blue-400">-</div>
            </div>
        </div>

        <div id="sidebar" class="lg:col-span-4 glass rounded-[2.5rem] p-6 md:p-8 flex flex-col border-blue-500/30">
            <h3 class="font-bold text-xs mb-4 flex items-center gap-2">
                <span class="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></span> 
                Analyst Commentary
            </h3>
            <div id="commentary" class="italic text-xs md:text-sm text-slate-400 leading-relaxed mb-4">
                "Enter your numbers above. Don't worry, I won't tell your professor you used a calculator."
            </div>
            <div id="pro-tip" class="hidden p-4 bg-blue-500/10 rounded-xl text-[10px] md:text-[11px] border-l-2 border-blue-500 text-blue-300">
                </div>
        </div>
    </div>

    <script>
        let currentMode = '';

        function showMode(mode) {
            currentMode = mode;
            document.getElementById('mode-selector').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById(mode + '-form').classList.remove('hidden');
            window.scrollTo(0, 0); // Reset scroll for mobile
        }

        function resetApp() {
            location.reload();
        }

        function processMath() {
            let x, commentary, tip = "";
            
            if (currentMode === 'basic') {
                const a = parseFloat(document.getElementById('basic-a').value);
                const b = parseFloat(document.getElementById('basic-b').value);
                const c = parseFloat(document.getElementById('basic-c').value);
                
                if (isNaN(a) || isNaN(b) || isNaN(c)) { alert("Fill the boxes!"); return; }
                if (a === 0) { alert("A cannot be zero. Physics says no."); return; }
                
                x = (c - b) / a;
                commentary = "Solved! It's basic linear algebra, but hey, a win is a win. You're one step closer to that Management degree.";
            } else {
                const a = parseFloat(document.getElementById('pro-a').value);
                const b = parseFloat(document.getElementById('pro-b').value);
                const c = parseFloat(document.getElementById('pro-c').value);
                const y = parseFloat(document.getElementById('pro-y').value);
                
                if (isNaN(a) || isNaN(b) || isNaN(c) || isNaN(y)) { alert("Parameters missing!"); return; }
                if (a === 0) { alert("Coeff A is zero. That's a vertical line, buddy. Can't solve it."); return; }
                
                x = (c - (b * y)) / a;
                commentary = "Optimization complete. This is the kind of critical thinking that builds empires. Or at least passes the final exam.";
                tip = `MANAGEMENT TIP: For every unit Y increases, X will change by exactly ${(-b/a).toFixed(2)}. Plan accordingly.`;
            }

            // UI Update
            document.getElementById('final-x').innerText = x.toFixed(2);
            document.getElementById('commentary').innerText = commentary;
            
            if (tip) {
                const tipEl = document.getElementById('pro-tip');
                tipEl.innerText = tip;
                tipEl.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
